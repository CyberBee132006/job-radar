<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
  --border: rgba(11,11,11,0.12); --accent: #2a78d6; --bad: #d03b3b; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;

}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; }
h1 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0 0 16px; color: var(--ink-2); }
input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; color: var(--ink-2); font-size: 13px; }
button { width: 100%; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
  border-radius: 8px; padding: 9px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
#err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
</style>

<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE = "jobradar-key";

async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    await unlock(key);
  } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} }
})();
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pw").value);
    if (document.getElementById("keep").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (_) {}
    }
    await unlock(key);
  } catch (x) {
    err.textContent = "Wrong passphrase.";
    go.disabled = false;
  }
};
</script>
