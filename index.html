<script>
// never run inside a frame (clickjacking); GitHub Pages can't send frame-ancestors
if (window.top !== window.self) { document.body.textContent = ""; throw new Error("framed"); }
try { localStorage.removeItem("jobradar-key"); } catch (e) {} // key stored by the old single-passphrase page
let P = JSON.parse(document.getElementById("payload").textContent);
const fresh = (async () => {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
    const v = (await (await fetch("version.txt?t=" + Date.now(), { cache: "no-store", signal: ctl.signal })).text()).trim();
    if (!v || v === P.id) return;
    const html = await (await fetch("./?v=" + encodeURIComponent(v), { cache: "no-store", signal: ctl.signal })).text();
    const m = html.match(/<script id="payload" type="application\/json">([^<]*)<\/script>/);
    if (m) { const n = JSON.parse(m[1]); if (n.v === 2) P = n; }
  } catch (e) {}
})();
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normUser = u => u.normalize("NFKC").trim().toLowerCase();
const DAY = 864e5, KEEP_DAYS = 7;

async function deriveKek(user, pass) {
  await fresh;
  const salt = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(P.ctx + normUser(user)))).slice(0, 16);
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  // non-extractable: if it is remembered, scripts can use it but can never read it out
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function openSlot(kek) {
  await fresh;
  for (const s of P.slots) {
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.i), additionalData: enc.encode("job-radar-slot-v2") }, kek, b64(s.c));
      const slot = JSON.parse(new TextDecoder().decode(plain));
      if (slot.e && slot.e.length) return slot;
    } catch (e) {}
  }
  return null;
}
// remembered sign-in: the non-extractable key in IndexedDB, with an expiry
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("job-radar", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("s");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction("s", mode); const q = fn(tx.objectStore("s")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  });
}
const remember = kek => idb("readwrite", s => s.put({ kek, exp: Date.now() + KEEP_DAYS * DAY }, "kek")).catch(() => {});
const recall = () => idb("readonly", s => s.get("kek")).catch(() => null);
const forget = () => idb("readwrite", s => s.delete("kek")).catch(() => {});

let opened = false;
const loaded = new Promise(r => document.readyState === "complete" ? r() : addEventListener("load", () => setTimeout(r), { once: true }));
async function show(slot, remembered) {
  if (opened) return;
  const entry = slot.e[0];
  const buf = new Uint8Array(await (await fetch(entry.f, { cache: "no-store" })).arrayBuffer());
  const key = await crypto.subtle.importKey("raw", b64(entry.k), "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12), additionalData: enc.encode("job-radar-page-v2") }, key, buf.slice(12)));
  await loaded;
  if (opened) return;
  opened = true;
  const session = { view: entry.v, remember: !!remembered, entries: slot.e };
  document.open();
  document.write(html.replace("<head>", "<head>\n<script>window.__JR=" + JSON.stringify(session).replace(/</g, "\\u003c") + ";<\/script>"));
  document.close();
}
(async () => {
  const saved = await recall();
  if (!saved || !saved.kek) return;
  if (!(saved.exp > Date.now())) return forget();
  document.getElementById("msg").textContent = "Signing you in...";
  const slot = await openSlot(saved.kek);
  if (slot) return show(slot, true);
  await forget(); // the account was removed or its password changed
  document.getElementById("msg").textContent = "Sign in to continue.";
})();
// slow down repeated guesses on this device (offline guessing is limited by the key derivation)
let fails = 0;
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  if (opened) return;
  const go = document.getElementById("go"), err = document.getElementById("err");
  const user = document.getElementById("u").value, pass = document.getElementById("pw").value;
  if (!user.trim() || !pass) { err.textContent = "Enter your username and password."; return; }
  go.disabled = true; err.textContent = ""; go.textContent = "Signing in...";
  let slot = null, kek = null;
  try { kek = await deriveKek(user, pass); slot = await openSlot(kek); } catch (x) {}
  if (!slot) {
    fails++;
    const wait = Math.min(30, 2 ** Math.min(fails, 5));
    err.textContent = "Wrong username or password.";
    go.textContent = `Try again in ${wait}s`;
    setTimeout(() => { go.disabled = false; go.textContent = "Sign in"; }, wait * 1000);
    return;
  }
  document.getElementById("pw").value = "";
  if (document.getElementById("keep").checked) await remember(kek); else await forget();
  try { await show(slot, document.getElementById("keep").checked); }
  catch (x) { err.textContent = "Signed in, but the page could not be loaded. Reload and try again."; go.disabled = false; go.textContent = "Sign in"; }
};
